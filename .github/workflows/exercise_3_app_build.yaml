name: Build and Test App
on:
  push:
    branches:
      - main
    
defaults:
  run:
    working-directory: excercises/3-github-actions/

jobs:
  Build_and_Run:
    runs-on: ubuntu-latest
    steps:
    
    - name: checkout code
      uses: actions/checkout@v5
    
    - name: set up pnpm
      uses: pnpm/action-setup@v4 
      with:
        version: latest

    - name: install dependency
      run: pnpm install 
    
    - name: view outdated packages
      run: pnpm outdated 

    - name: prettify the code
      run: pnpm prettier . --write

    - name: run tests
      run: pnpm test